{% extends 'base.html' %}

{% block title %}Page Not Found | BookBazar{% endblock %}

{% block content %}
<div class="container text-center py-5" style="margin-top: 140px; margin-bottom: 80px;">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="p-5 rounded-4 shadow-lg" style="background: rgba(17, 17, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);">
                <div class="display-1 fw-bold text-primary mb-3">404</div>
                <h2 class="fw-bold text-white mb-3">📖 Page Not Found</h2>
                <p class="text-white-50 lead mb-4">
                    The page or chapter you are looking for might have been moved, renamed, or does not exist.
                </p>
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <a href="{{ url_for('home') }}" class="btn btn-primary rounded-pill px-4 py-2">
                        <i class="bi bi-house-door-fill me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('books') }}" class="btn btn-outline-light rounded-pill px-4 py-2">
                        <i class="bi bi-book me-1"></i> Browse Catalog
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
