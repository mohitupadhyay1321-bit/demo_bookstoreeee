<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | BookBazar</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #070913;
            --card-bg: rgba(15, 23, 42, 0.55);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-glow: #6366f1;
            --accent: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background Spheres */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }

        .glow-1 {
            background: var(--primary-glow);
            top: -10%;
            left: -10%;
            animation: float 20s infinite alternate;
        }

        .glow-2 {
            background: var(--accent);
            bottom: -10%;
            right: -10%;
            animation: float-reverse 20s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.1); }
        }

        @keyframes float-reverse {
            0% { transform: translate(0, 0) scale(1.1); }
            100% { transform: translate(-80px, -50px) scale(1); }
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3),
                        0 0 40px rgba(99, 102, 241, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        0 0 50px rgba(168, 85, 247, 0.08);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .badge-admin {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 2px;
            margin-bottom: 0.5rem;
        }

        .input-group {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding-left: 16px;
            padding-right: 10px;
        }

        .form-control {
            background: transparent;
            border: none;
            color: var(--text-main) !important;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-control:focus {
            background: transparent;
            box-shadow: none;
            border: none;
        }

        .form-control::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        /* Password Toggle Button */
        .btn-toggle-password {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding-right: 16px;
            transition: color 0.2s ease;
        }

        .btn-toggle-password:hover {
            color: var(--text-main);
        }

        /* Login Button */
        .btn-login {
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--accent) 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 13px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
            color: #ffffff;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-login:hover::after {
            left: 100%;
            transition: 0.6s ease-in-out;
        }

        /* Footer Link */
        .back-to-store {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 1.8rem;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .back-to-store:hover {
            color: var(--primary-glow);
            transform: translateX(-4px);
        }
    </style>
</head>
<body>

    <!-- Ambient background glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="login-container">
        <div class="glass-card text-center">
            
            <!-- Shield emblem badge -->
            <div class="badge-admin">
                <i class="bi bi-shield-lock-fill"></i> Secure Control
            </div>
            
            <h2 class="mb-1">Admin Portal</h2>
            <p class="subtitle">Enter your credentials to access the console</p>

            <form action="/admin-login" method="POST" class="text-start">
                
                <!-- Email Input -->
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email"
                               class="form-control"
                               name="email"
                               placeholder="admin@bookbazar.com"
                               required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password"
                               id="password"
                               class="form-control"
                               name="password"
                               placeholder="••••••••"
                               required>
                        <button class="btn-toggle-password" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button class="btn btn-login w-100">
                    Sign In to Console
                </button>
                
            </form>

            <!-- Back navigation link -->
            <div>
                <a href="/" class="back-to-store">
                    <i class="bi bi-arrow-left"></i> Back to Storefront
                </a>
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleIcon = document.getElementById("toggleIcon");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove("bi-eye");
                toggleIcon.classList.add("bi-eye-slash");
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove("bi-eye-slash");
                toggleIcon.classList.add("bi-eye");
            }
        }
    </script>
</body>
</html>
