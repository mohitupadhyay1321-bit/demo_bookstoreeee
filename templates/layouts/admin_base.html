<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>{% block title %}{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/admin.css') }}">

</head>

<body>

<div class="wrapper">

    {% include 'admin/sidebar.html' %}

    <div class="main">

        {% include 'admin/navbar.html' %}

        <div class="content">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    window.isUserLoggedIn = {{ 'true' if session.get('user') else 'false' }};
</script>
<script src="{{ url_for('static', filename='js/cart.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const countBadge = document.getElementById("adminNotificationCountBadge");
    const dropdownCount = document.getElementById("notificationDropdownCount");
    const listBody = document.getElementById("notificationListBody");
    const clearBtn = document.getElementById("btnClearNotifications");

    function fetchAdminNotifications() {
        fetch('/api/admin/notifications')
            .then(res => res.json())
            .then(data => {
                if (!data.success) return;
                
                const unreadCount = data.unread_count || 0;

                if (countBadge) {
                    if (unreadCount > 0) {
                        countBadge.textContent = unreadCount;
                        countBadge.style.display = "inline-block";
                    } else {
                        countBadge.style.display = "none";
                    }
                }

                if (dropdownCount) {
                    dropdownCount.textContent = unreadCount > 0 ? `${unreadCount} New` : `0 New`;
                    dropdownCount.className = unreadCount > 0 ? "badge badge-notif-count rounded-pill" : "badge badge-notif-empty rounded-pill";
                }

                if (listBody) {
                    if (data.notifications && data.notifications.length > 0) {
                        let html = '';
                        data.notifications.forEach(item => {
                            const unreadClass = item.is_unread ? 'unread' : '';
                            const unreadDot = item.is_unread ? '<span class="badge bg-primary rounded-circle p-1 ms-1" style="width: 7px; height: 7px; display: inline-block;"></span>' : '';
                            html += `
                                <a href="${item.link}" class="notification-item ${unreadClass}">
                                    <div class="notification-icon-wrap ${item.badge_class}">
                                        <i class="bi ${item.icon}"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <div class="notification-text-title d-flex align-items-center justify-content-between">
                                            <span>${item.title}</span>
                                            ${unreadDot}
                                        </div>
                                        <div class="notification-text-desc">${item.message}</div>
                                        <div class="notification-text-time"><i class="bi bi-clock me-1"></i>${item.time}</div>
                                    </div>
                                </a>
                            `;
                        });
                        listBody.innerHTML = html;
                    } else {
                        listBody.innerHTML = `
                            <div class="text-center py-4 text-muted">
                                <i class="bi bi-bell-slash fs-3 d-block mb-1"></i>
                                <span class="small">No notifications found</span>
                            </div>
                        `;
                    }
                }
            })
            .catch(err => console.error("Error fetching notifications:", err));
    }

    function markAllAsRead() {
        fetch('/api/admin/notifications/mark-read', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                if (countBadge) countBadge.style.display = "none";
                if (dropdownCount) {
                    dropdownCount.textContent = "0 New";
                    dropdownCount.className = "badge bg-secondary bg-opacity-25 text-white-50 rounded-pill small";
                }
                document.querySelectorAll(".notification-item.unread").forEach(el => el.classList.remove("unread"));
                document.querySelectorAll(".notification-item .badge.bg-primary.rounded-circle").forEach(el => el.remove());
            }
        })
        .catch(err => console.error("Error marking notifications as read:", err));
    }

    if (clearBtn) {
        clearBtn.addEventListener("click", function (e) {
            e.preventDefault();
            markAllAsRead();
        });
    }

    // Initial load and periodic refresh every 10s
    fetchAdminNotifications();
    setInterval(fetchAdminNotifications, 10000);
});
</script>
{% block extra_js %}
{% endblock %}
</body>

</html>
