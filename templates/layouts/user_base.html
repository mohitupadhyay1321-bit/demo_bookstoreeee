<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        /* Custom hover color for user space sidebar */
        .sidebar a:hover {
            background: #9c436b !important;
            padding-left: 20px;
        }
        body {
            background: #0d0d11; /* Sleek dark mode for user space */
            color: #ffffff;
        }
        .topbar {
            background: #111114;
            border-bottom: 1px solid #222;
            color: white;
        }
        .card {
            background: #111114 !important;
            color: white !important;
        }
        .form-control, .form-select {
            background-color: #1e1e24 !important;
            color: white !important;
            border-color: #333 !important;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1e1e24 !important;
            color: white !important;
            border-color: #9c436b !important;
            box-shadow: 0 0 0 0.25rem rgba(156, 67, 107, 0.25) !important;
        }
        .table {
            color: white !important;
        }
        .content .container {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* Workspace Text Contrast Hierarchy */
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
            color: #ffffff !important;
        }

        .content p, .content td, .content .table {
            color: #e2e8f0 !important;
        }

        .content label, .content .form-label, .content th {
            color: #94a3b8 !important; /* Slate-400 */
        }

        .content .text-muted {
            color: #64748b !important; /* Slate-500 */
        }

        .content input, .content textarea, .content select {
            background-color: #1e1e24 !important;
            color: #ffffff !important;
            border-color: #33333b !important;
        }

        .content input::placeholder, .content textarea::placeholder {
            color: #4b5563 !important; /* Gray-600 */
        }
    </style>
</head>

<body>
<div class="wrapper">
    {% include 'components/user_sidebar.html' %}
    <div class="main">
        <!-- User Topbar -->
        <div class="topbar shadow-sm">
            <div>
                <h5 class="m-0 fw-bold"><i class="bi bi-person-workspace text-primary me-2"></i>User Dashboard</h5>
            </div>
            <div class="profile">
                <span class="fw-bold">{{ session.get('user_name') or session.get('user') }}</span>
                {% if session.get('user_avatar') %}
                    <img src="{{ session.get('user_avatar') }}" alt="Avatar" style="width: 40px; height: 40px; object-fit: cover; border-radius: 50%;">
                {% else %}
                    <div class="bg-secondary bg-opacity-50 text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-person-fill fs-5"></i>
                    </div>
                {% endif %}
            </div>
        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    window.isUserLoggedIn = {{ 'true' if session.get('user') else 'false' }};
</script>
<!-- Cart & Wishlist Script -->
<script src="{{ url_for('static', filename='js/cart.js') }}"></script>
{% block extra_js %}
{% endblock %}
</body>

</html>
