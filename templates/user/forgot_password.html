<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | BookBazar</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Login CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="container-fluid">
    <div class="row vh-100">
        <!-- LEFT SIDE -->
        <div class="col-lg-6 left-side d-none d-lg-flex">
            <div class="overlay">
                <h1>{{ store_name }}</h1>
                <h3>Every Book Deserves Another Reader</h3>
                <p>Buy New Books • Sell Pre-Loved Books • Join India's Reading Community</p>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-lg-6 d-flex align-items-center justify-content-center">
            <div class="login-card">
                <h2>Forgot Password 🔑</h2>
                <p class="subtitle">Enter your registered email address to reset your password.</p>

                {% if error %}
                <div class="alert alert-danger border-0 shadow-sm rounded-4 p-3 mb-4 text-center" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form action="{{ url_for('forgot_password') }}" method="POST">
                    <div class="mb-4">
                        <label>Registered Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
                        </div>
                    </div>

                    <button class="btn login-btn w-100 py-3 rounded-pill fw-bold">
                        Continue to Reset Password
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
