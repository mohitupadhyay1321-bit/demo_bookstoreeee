{% extends 'base.html' %}

{% block title %}Register | BookBazar{% endblock %}

{% block content %}
<div class="container py-5" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow rounded-4 p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Create Account 👋</h2>
                    <p class="text-muted">Join India's reading community</p>
                </div>
                {% if error %}
                <div class="alert alert-danger border-0 shadow-sm rounded-4 p-3 mb-4 text-center" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted">Full Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Enter Full Name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Email Address</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter Email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                    </div>
                    <div class="mb-4">
                        <input type="checkbox" required> I agree to the terms and conditions
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">Register</button>
                </form>
                
                <hr class="my-4">
                <p class="text-center mb-0">
                    Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
